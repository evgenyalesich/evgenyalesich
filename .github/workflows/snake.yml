name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: evgenyalesich
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#06121f,#0e7490,#0891b2,#22d3ee,#818cf8

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
