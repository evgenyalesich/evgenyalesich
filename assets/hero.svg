<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560"><stop stop-color="#020617"/><stop offset=".5" stop-color="#071525"/><stop offset="1" stop-color="#061D29"/></linearGradient>
  <linearGradient id="neon" x1="80" y1="0" x2="1110" y2="0"><stop stop-color="#2DD4BF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#22D3EE" stop-opacity=".24"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#38BDF8" stroke-opacity=".045"/></pattern>
  <clipPath id="screen"><rect x="20" y="20" width="1160" height="520" rx="20"/></clipPath>
  <style>
    .mono{font-family:'JetBrains Mono',monospace}.sans{font-family:Inter,Arial,sans-serif}.micro{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.16em;fill:#64748B}.small{font:600 13px 'JetBrains Mono',monospace;fill:#94A3B8}.chip{font:700 12px 'JetBrains Mono',monospace;fill:#CFFAFE}.name{font:900 69px Inter,Arial,sans-serif;letter-spacing:-.045em;fill:#F8FAFC}.role{font:600 24px Inter,Arial,sans-serif;fill:#CBD5E1}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(600px)}}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,8px)}}@keyframes fall{0%{transform:translateY(-150px);opacity:0}10%{opacity:.55}90%{opacity:.55}100%{transform:translateY(650px);opacity:0}}@keyframes rotate{to{transform:rotate(360deg)}}
    .scan{animation:scan 5s linear infinite}.flow{stroke-dasharray:10 10;animation:dash 4s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.blink{animation:blink 1s steps(1) infinite}.drift{animation:drift 6s ease-in-out infinite}.spin{animation:rotate 18s linear infinite;transform-origin:920px 278px}.rain1{animation:fall 7s linear infinite}.rain2{animation:fall 9s linear 2s infinite}.rain3{animation:fall 8s linear 4s infinite}
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/><rect width="1200" height="560" rx="24" fill="url(#grid)"/><circle cx="1020" cy="120" r="310" fill="url(#halo)"/><rect x="1" y="1" width="1198" height="558" rx="23" stroke="#1E3A5F" stroke-width="2"/>
<g clip-path="url(#screen)" opacity=".32" class="mono"><g class="rain1" fill="#22D3EE" font-size="11"><text x="1040" y="0">01100101</text><text x="1100" y="90">POSTGRES</text><text x="760" y="180">ASYNC</text></g><g class="rain2" fill="#818CF8" font-size="10"><text x="1140" y="20">101101</text><text x="820" y="120">REDIS</text><text x="1010" y="270">EVENT</text></g><g class="rain3" fill="#2DD4BF" font-size="10"><text x="730" y="10">FASTAPI</text><text x="1080" y="200">WORKER</text><text x="780" y="330">01001</text></g></g>
<rect class="scan" x="20" y="0" width="1160" height="2" fill="#22D3EE" opacity=".22" filter="url(#glow)"/>
<g transform="translate(70 52)"><circle r="5" fill="#2DD4BF" class="pulse"/><text x="17" y="4" class="micro" fill="#67E8F9">ENGINEERING COMMAND CENTER // ONLINE</text></g>
<g transform="translate(70 118)"><text class="name">EVGENY</text><text y="78" class="name">ALESICH<tspan fill="#22D3EE">.</tspan></text><rect y="103" width="570" height="3" rx="2" fill="url(#neon)" filter="url(#glow)"/><text y="151" class="role">PRODUCT BACKEND ENGINEER</text><text y="188" class="small">$ building reliable systems from messy reality<tspan fill="#22D3EE" class="blink">_</tspan></text></g>
<g transform="translate(70 350)"><rect width="570" height="108" rx="14" fill="#07111F" stroke="#17324B"/><circle cx="22" cy="20" r="5" fill="#F87171"/><circle cx="40" cy="20" r="5" fill="#FACC15"/><circle cx="58" cy="20" r="5" fill="#4ADE80"/><text x="22" y="52" class="small"><tspan fill="#22D3EE">evgeny@github</tspan><tspan fill="#64748B">:</tspan><tspan fill="#818CF8">~/systems</tspan><tspan fill="#64748B">$</tspan> ./ship --value</text><text x="22" y="79" class="small" fill="#CBD5E1">✓ APIs  ✓ DATA  ✓ AUTOMATION  ✓ PRODUCT UI</text><text x="22" y="99" class="micro">STATUS: TURNING COMPLEXITY INTO LEVERAGE</text></g>
<g class="spin"><circle cx="920" cy="278" r="172" stroke="#164E63"/><circle cx="920" cy="278" r="138" stroke="#1E3A5F" stroke-dasharray="3 10"/><circle cx="920" cy="106" r="7" fill="#22D3EE" filter="url(#glow)"/><circle cx="1092" cy="278" r="7" fill="#818CF8" filter="url(#glow)"/><circle cx="920" cy="450" r="7" fill="#3B82F6" filter="url(#glow)"/><circle cx="748" cy="278" r="7" fill="#2DD4BF" filter="url(#glow)"/></g>
<g class="drift"><circle cx="920" cy="278" r="91" fill="#071827" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/><path d="M866 278H974M920 224V332" stroke="#22D3EE" stroke-width="2" class="flow"/><circle cx="920" cy="278" r="42" stroke="#818CF8"/><text x="885" y="273" class="micro" fill="#67E8F9">BUILD</text><text x="881" y="293" class="micro">SYSTEMS</text></g>
<g class="micro"><text x="902" y="77">API</text><text x="1110" y="282">DATA</text><text x="902" y="486">UI</text><text x="690" y="282">OPS</text></g>
<path d="M720 505H1120" stroke="url(#neon)" class="flow"/><circle cx="720" cy="505" r="5" fill="#2DD4BF" class="pulse"/><text x="800" y="530" class="micro">PYTHON · DJANGO · FASTAPI · POSTGRESQL · REDIS</text>
</svg>
