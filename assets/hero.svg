<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#050816"/><stop offset=".52" stop-color="#0B1220"/><stop offset="1" stop-color="#071827"/></linearGradient>
    <linearGradient id="accent" x1="110" y1="90" x2="1040" y2="365" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#3B82F6"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22D3EE" stop-opacity=".2"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity=".055"/></pattern>
    <style>
      .eyebrow{font:700 13px 'JetBrains Mono',monospace;letter-spacing:.24em;fill:#67E8F9}.name{font:800 62px Inter,Arial,sans-serif;letter-spacing:-.04em;fill:#F8FAFC}.role{font:500 22px Inter,Arial,sans-serif;fill:#CBD5E1}.code{font:500 14px 'JetBrains Mono',monospace;fill:#94A3B8}.chip{font:700 12px 'JetBrains Mono',monospace;fill:#CFFAFE;letter-spacing:.04em}.tiny{font:600 10px 'JetBrains Mono',monospace;fill:#64748B;letter-spacing:.12em}
      @keyframes dash{to{stroke-dashoffset:-80}}@keyframes pulse{0%,100%{opacity:.35;r:5}50%{opacity:1;r:8}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
      .flow{stroke-dasharray:10 10;animation:dash 3s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite;transform-origin:center}.cursor{animation:blink 1.1s steps(1) infinite}
    </style>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/><rect width="1200" height="440" rx="24" fill="url(#grid)"/><circle cx="1040" cy="80" r="230" fill="url(#halo)"/><circle cx="90" cy="430" r="180" fill="url(#halo)" opacity=".55"/><rect x="1" y="1" width="1198" height="438" rx="23" stroke="#1E293B" stroke-width="2"/>
  <g transform="translate(72 64)">
    <circle cx="0" cy="0" r="5" fill="#22D3EE" class="pulse"/><text x="18" y="5" class="eyebrow">SYSTEM ONLINE · MINSK / REMOTE</text><text x="0" y="91" class="name">EVGENY ALESICH</text><rect x="0" y="116" width="590" height="2" rx="1" fill="url(#accent)"/><text x="0" y="158" class="role">Product Backend Engineer</text><text x="0" y="193" class="code">I build the engine behind complex products<tspan class="cursor" fill="#22D3EE">_</tspan></text>
    <g transform="translate(0 229)"><rect width="128" height="36" rx="8" fill="#0F2132" stroke="#164E63"/><text x="19" y="23" class="chip">PYTHON</text><rect x="140" width="128" height="36" rx="8" fill="#0F2132" stroke="#164E63"/><text x="159" y="23" class="chip">FASTAPI</text><rect x="280" width="128" height="36" rx="8" fill="#0F2132" stroke="#164E63"/><text x="299" y="23" class="chip">DJANGO</text><rect x="420" width="148" height="36" rx="8" fill="#0F2132" stroke="#164E63"/><text x="439" y="23" class="chip">POSTGRESQL</text></g>
    <text x="0" y="310" class="tiny">BACKENDS · DATA · AUTOMATION · PRODUCT SYSTEMS</text>
  </g>
  <g transform="translate(790 70)">
   <g class="float">
    <circle cx="150" cy="150" r="118" stroke="#1E3A5F"/><circle cx="150" cy="150" r="82" stroke="#1E3A5F" stroke-dasharray="4 7"/><circle cx="150" cy="150" r="42" fill="#0B2032" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/><path d="M126 150h48M150 126v48" stroke="#67E8F9" stroke-width="2"/><path d="M150 32V108M268 150H192M150 268V192M32 150H108" class="flow" stroke="url(#accent)" stroke-width="2"/><circle cx="150" cy="32" r="8" fill="#22D3EE"/><circle cx="268" cy="150" r="8" fill="#3B82F6"/><circle cx="150" cy="268" r="8" fill="#818CF8"/><circle cx="32" cy="150" r="8" fill="#2DD4BF"/><text x="122" y="13" class="tiny">API</text><text x="282" y="154" class="tiny">DATA</text><text x="122" y="294" class="tiny">UI</text><text x="-16" y="154" class="tiny">OPS</text>
   </g>
  </g>
</svg>
