<svg width="920" height="540" viewBox="0 0 920 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="radar" x1="287" y1="104" x2="633" y2="418" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.74"/>
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0.44"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #e5e7eb; }
      .sub { font: 500 12px Inter, Arial, sans-serif; fill: #94a3b8; }
      .small { font: 700 11px Inter, Arial, sans-serif; fill: #67e8f9; letter-spacing: .08em; }
      .grid { stroke: #334155; stroke-width: 1.2; }
      .axis { stroke: #475569; stroke-width: 1; stroke-dasharray: 5 7; }
      @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .scan { transform-origin: 460px 260px; animation: rotate 8s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="920" height="540" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="884" height="504" rx="14" stroke="#1e293b"/>
  <circle cx="790" cy="88" r="74" fill="#0ea5e9" opacity=".08"/>
  <circle cx="110" cy="420" r="92" fill="#22c55e" opacity=".07"/>

  <text x="48" y="58" class="small">ENGINEERING LOADOUT / ROLE RADAR</text>
  <text x="48" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">Evgeny Alesich</text>
  <text x="48" y="119" class="sub">Backend-heavy fullstack developer: APIs, analytics, automation, product dashboards.</text>
  <text x="48" y="144" class="small">MAIN ATTRIBUTE: PRODUCT BACKEND</text>

  <g transform="translate(470 268)">
    <polygon class="grid" points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80"/>
    <polygon class="grid" points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
    <polygon class="grid" points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"/>
    <polygon class="grid" points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20"/>

    <line class="axis" x1="0" y1="0" x2="0" y2="-174"/>
    <line class="axis" x1="0" y1="0" x2="151" y2="-87"/>
    <line class="axis" x1="0" y1="0" x2="151" y2="87"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="174"/>
    <line class="axis" x1="0" y1="0" x2="-151" y2="87"/>
    <line class="axis" x1="0" y1="0" x2="-151" y2="-87"/>

    <polygon class="pulse" points="0,-148 125,-72 92,53 0,118 -118,68 -130,-75" fill="url(#radar)" stroke="#67e8f9" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="-148" r="5" fill="#e0f2fe"/>
    <circle cx="125" cy="-72" r="5" fill="#e0f2fe"/>
    <circle cx="92" cy="53" r="5" fill="#e0f2fe"/>
    <circle cx="0" cy="118" r="5" fill="#e0f2fe"/>
    <circle cx="-118" cy="68" r="5" fill="#e0f2fe"/>
    <circle cx="-130" cy="-75" r="5" fill="#e0f2fe"/>
    <circle r="4" fill="#e0f2fe"/>
    <path class="scan" d="M0 0 L0 -158 A158 158 0 0 1 137 -79 Z" fill="#38bdf8" opacity=".08"/>
  </g>

  <text x="420" y="68" class="label">Backend APIs</text>
  <text x="648" y="168" class="label">Data / SQL</text>
  <text x="656" y="420" class="label">Frontend UI</text>
  <text x="445" y="502" class="label">DevOps</text>
  <text x="176" y="424" class="label">Automation</text>
  <text x="272" y="174" class="label">Product Thinking</text>

  <g transform="translate(48 178)">
    <rect width="178" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="24" class="sub">Django / DRF / FastAPI</text>
    <rect y="52" width="178" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="76" class="sub">PostgreSQL / Redis</text>
    <rect y="104" width="178" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="128" class="sub">Telegram / workers</text>
  </g>

  <g transform="translate(704 178)">
    <rect width="178" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="24" class="sub">React / TypeScript</text>
    <rect y="52" width="178" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="76" class="sub">Dashboards / CRM</text>
    <rect y="104" width="178" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="128" class="sub">Analytics platforms</text>
  </g>

  <g transform="translate(252 460)">
    <rect width="438" height="42" rx="12" fill="#020617" stroke="#1e293b"/>
    <text x="26" y="27" class="sub">Role balance: backend 42% · data 24% · product UI 18% · automation 16%</text>
  </g>
</svg>
