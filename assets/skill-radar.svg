<svg width="920" height="560" viewBox="0 0 920 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="radarFill" x1="330" y1="126" x2="590" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity=".78"/>
      <stop offset=".58" stop-color="#06b6d4" stop-opacity=".62"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".45"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 31px Inter, Arial, sans-serif; fill: #f8fafc; }
      .label { font: 800 15px Inter, Arial, sans-serif; fill: #e0f2fe; }
      .sub { font: 500 12px Inter, Arial, sans-serif; fill: #9fb6d8; }
      .mini { font: 800 10px Inter, Arial, sans-serif; fill: #22d3ee; letter-spacing: .12em; }
      .grid { stroke: #334155; stroke-width: 1.15; }
      .axis { stroke: #475569; stroke-width: 1; stroke-dasharray: 5 7; }
      .card { fill: #0f172a; stroke: #243044; }
      @keyframes pulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .scan { transform-origin: 462px 285px; animation: rotate 9s linear infinite; }
    </style>
  </defs>

  <rect width="920" height="560" rx="20" fill="url(#bg)"/>
  <rect x="22" y="22" width="876" height="516" rx="16" stroke="#1e293b"/>
  <circle cx="790" cy="96" r="72" fill="#0ea5e9" opacity=".08"/>
  <circle cx="116" cy="436" r="88" fill="#22c55e" opacity=".06"/>

  <text x="52" y="62" class="mini">ENGINEERING LOADOUT / ROLE RADAR</text>
  <text x="52" y="99" class="title">Evgeny Alesich</text>
  <text x="52" y="126" class="sub">Backend-heavy fullstack developer: APIs, analytics, automation and product dashboards.</text>
  <text x="52" y="153" class="mini">MAIN ATTRIBUTE: PRODUCT BACKEND</text>

  <g transform="translate(52 185)">
    <rect class="card" width="210" height="42" rx="9"/>
    <text x="18" y="26" class="sub">Django / DRF / FastAPI</text>
    <rect class="card" y="58" width="210" height="42" rx="9"/>
    <text x="18" y="84" class="sub">PostgreSQL / Redis</text>
    <rect class="card" y="116" width="210" height="42" rx="9"/>
    <text x="18" y="142" class="sub">Telegram / workers</text>
  </g>

  <g transform="translate(700 185)">
    <rect class="card" width="170" height="42" rx="9"/>
    <text x="18" y="26" class="sub">React / TypeScript</text>
    <rect class="card" y="58" width="170" height="42" rx="9"/>
    <text x="18" y="84" class="sub">Dashboards / CRM</text>
    <rect class="card" y="116" width="170" height="42" rx="9"/>
    <text x="18" y="142" class="sub">Analytics platforms</text>
  </g>

  <g transform="translate(462 285)">
    <polygon class="grid" points="0,-145 126,-72 126,72 0,145 -126,72 -126,-72"/>
    <polygon class="grid" points="0,-108 94,-54 94,54 0,108 -94,54 -94,-54"/>
    <polygon class="grid" points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"/>
    <polygon class="grid" points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18"/>

    <line class="axis" x1="0" y1="0" x2="0" y2="-158"/>
    <line class="axis" x1="0" y1="0" x2="137" y2="-79"/>
    <line class="axis" x1="0" y1="0" x2="137" y2="79"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="158"/>
    <line class="axis" x1="0" y1="0" x2="-137" y2="79"/>
    <line class="axis" x1="0" y1="0" x2="-137" y2="-79"/>

    <polygon class="pulse" points="0,-136 116,-67 86,49 0,108 -108,62 -119,-69" fill="url(#radarFill)" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="-136" r="5" fill="#e0f2fe"/>
    <circle cx="116" cy="-67" r="5" fill="#e0f2fe"/>
    <circle cx="86" cy="49" r="5" fill="#e0f2fe"/>
    <circle cx="0" cy="108" r="5" fill="#e0f2fe"/>
    <circle cx="-108" cy="62" r="5" fill="#e0f2fe"/>
    <circle cx="-119" cy="-69" r="5" fill="#e0f2fe"/>
    <circle r="4" fill="#e0f2fe"/>
  </g>

  <path class="scan" d="M462 285 L462 142 A143 143 0 0 1 586 214 Z" fill="#38bdf8" opacity=".08"/>

  <g>
    <rect x="386" y="86" width="152" height="32" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="410" y="107" class="label">Backend APIs</text>
    <rect x="620" y="152" width="120" height="32" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="641" y="173" class="label">Data / SQL</text>
    <rect x="638" y="412" width="132" height="32" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="655" y="433" class="label">Frontend UI</text>
    <rect x="402" y="486" width="112" height="32" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="430" y="507" class="label">DevOps</text>
    <rect x="166" y="412" width="126" height="32" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="186" y="433" class="label">Automation</text>
    <rect x="286" y="152" width="164" height="32" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="307" y="173" class="label">Product Thinking</text>
  </g>

  <g transform="translate(250 462)">
    <rect width="430" height="42" rx="12" fill="#020617" stroke="#1e293b"/>
    <text x="24" y="27" class="sub">Role balance: backend 42% · data 24% · UI 18% · automation 16%</text>
  </g>
</svg>
