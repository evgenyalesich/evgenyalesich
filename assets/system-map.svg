<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="330"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1728"/></linearGradient><linearGradient id="line" x1="100" y1="0" x2="1100" y2="0"><stop stop-color="#2DD4BF"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient><filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.over{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.18em;fill:#64748B}.title{font:800 22px Inter,Arial,sans-serif;fill:#F1F5F9}.sub{font:500 13px Inter,Arial,sans-serif;fill:#94A3B8}@keyframes travel{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(900px);opacity:0}}@keyframes beat{0%,100%{opacity:.55}50%{opacity:1}}.packet{animation:travel 6s linear infinite}.packet2{animation:travel 6s linear 2s infinite;opacity:0}.beat{animation:beat 2.4s ease-in-out infinite}</style>
