<svg width="920" height="390" viewBox="0 0 920 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset=".55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="88" y1="312" x2="832" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c55e"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 27px Inter, Arial, sans-serif; fill: #f8fafc; }
      .label { font: 800 17px Inter, Arial, sans-serif; fill: #e0f2fe; }
      .sub { font: 500 12px Inter, Arial, sans-serif; fill: #a8bddc; }
      .mini { font: 800 10px Inter, Arial, sans-serif; fill: #22d3ee; letter-spacing: .12em; }
      .card { fill: #0f172a; stroke: #243044; }
    </style>
  </defs>

  <rect width="920" height="390" rx="20" fill="url(#bg)"/>
  <rect x="22" y="22" width="876" height="346" rx="16" stroke="#1e293b"/>

  <text x="56" y="64" class="mini">PROJECT SIGNAL MAP</text>
  <text x="56" y="99" class="title">Systems I Build</text>
  <text x="56" y="126" class="sub">From business events and integrations to APIs, data models, dashboards and admin workflows.</text>

  <g transform="translate(56 162)">
    <rect class="card" width="186" height="112" rx="13"/>
    <text x="18" y="34" class="label">Integrations</text>
    <text x="18" y="61" class="sub">Telegram bots</text>
    <text x="18" y="82" class="sub">Google Sheets sync</text>
    <text x="18" y="103" class="sub">External APIs</text>
  </g>

  <g transform="translate(268 162)">
    <rect class="card" width="186" height="112" rx="13"/>
    <text x="18" y="34" class="label">Backend Core</text>
    <text x="18" y="61" class="sub">Django / FastAPI</text>
    <text x="18" y="82" class="sub">Auth / permissions</text>
    <text x="18" y="103" class="sub">Service layer</text>
  </g>

  <g transform="translate(480 162)">
    <rect class="card" width="186" height="112" rx="13"/>
    <text x="18" y="34" class="label">Data Layer</text>
    <text x="18" y="61" class="sub">PostgreSQL</text>
    <text x="18" y="82" class="sub">Attribution</text>
    <text x="18" y="103" class="sub">Aggregates / Redis</text>
  </g>

  <g transform="translate(692 162)">
    <rect class="card" width="186" height="112" rx="13"/>
    <text x="18" y="34" class="label">Product UI</text>
    <text x="18" y="61" class="sub">React dashboards</text>
    <text x="18" y="82" class="sub">CRM / admin panels</text>
    <text x="18" y="103" class="sub">Reports / Kanban</text>
  </g>

  <path d="M110 316 H810" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="110" cy="316" r="8" fill="#22c55e"/>
  <circle cx="330" cy="316" r="8" fill="#22d3ee"/>
  <circle cx="558" cy="316" r="8" fill="#6366f1"/>
  <circle cx="810" cy="316" r="8" fill="#14b8a6"/>

  <text x="130" y="321" class="sub">Business workflow first</text>
  <text x="350" y="321" class="sub">Backend boundaries</text>
  <text x="578" y="321" class="sub">Data visibility</text>
  <text x="830" y="321" class="sub">Automation</text>
</svg>
